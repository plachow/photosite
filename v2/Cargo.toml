[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# Two, because this is PhotoSite — the second of it, not a different
# application that happens to look like one. v1 stopped at 0.9.x and is
# frozen; nothing will ever be released between the two.
version = "2.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

# Versions are kept here, so the crates never drift apart.
[workspace.dependencies]
photosite-core = { path = "crates/photosite-core" }
photosite-image = { path = "crates/photosite-image" }
photosite-meta = { path = "crates/photosite-meta" }
photosite-faces = { path = "crates/photosite-faces" }
photosite-batch = { path = "crates/photosite-batch" }
photosite-ai = { path = "crates/photosite-ai" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rusqlite = { version = "0.38", features = ["bundled"] }
crossbeam-channel = "0.5"
fluent-bundle = "0.16"
unic-langid = { version = "0.9", features = ["macros"] }
walkdir = "2"
# The recycle bin on all three, rather than deleting outright. Deleting a
# photograph is not something to be brave about.
trash = "5"
# Watching a folder, so that what another program does to it shows here.
notify = "8"
# Native dialogs. On Linux through the XDG portal rather than GTK: the portal
# handles Wayland and Flatpak and needs no extra C headers to build.
rfd = "0.17"
# One `block_on`, nothing more. The dialog is created on the main thread and
# awaited elsewhere; that needs no async runtime. `eframe` already carries the
# same version, so this line adds nothing to the tree.
pollster = "1"
# The Windows clipboard's file list (CF_HDROP), so a copy here can be pasted
# in Explorer and a copy there pasted here. Windows only, deliberately: no
# other platform agrees on how to put files on a clipboard, and pretending
# otherwise would be a portable API over an unportable idea.
clipboard-win = "5"
# Installing, and one day updating. Velopack is what v1 shipped with, and the
# reasons hold better here: it needs no administrator, no MSI and no code
# signing certificate to produce something somebody can double-click, and the
# same package it installs from is the one an update is later fetched from.
# The alternatives were weighed in `packaging/README.md`.
#
# It is not free: fifty crates, of which a whole TLS stack, and 1.9 MB on the
# window binary — 46.9 to 48.8. Fetching a release over HTTPS is what the
# crate is *for*, so this is the honest price of the feature rather than a
# stack dragged in by accident; see the note on `ureq` below, which it
# changes. Only `photosite-ui` carries it, because only the installed
# application is ever asked to update itself.
velopack = "1.2"
# One call — attaching to the console that started us — because the binary is
# built for the windowed subsystem and would otherwise have nowhere to print.
# The crate is already in the tree twice over through eframe; naming it here
# adds a line, not a build.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }
# The icon and the version, compiled into the executable. Only ever a build
# dependency, and only on Windows.
winresource = "0.1"
# Talking to Ollama. **No TLS feature, deliberately**: the address is
# localhost out of the box and the whole feature is built round a model on
# this machine. Shipping a TLS stack so that a local socket can be spoken to
# is the trade this application does not make — the same reasoning as
# exiftool, at a smaller scale.
#
# This asks for none, and gets none in `photosite-cli`. In `photosite-ui` it
# gets one anyway: velopack wants `ureq` with rustls, features unify across a
# binary, and there is no arguing with that. The line above is still the right
# request — it is what keeps the headless binary lean, and it is what would
# take the TLS back out of the window binary on the day the updater goes.
ureq = { version = "3", default-features = false }
# JSON, both ways. The model is asked for a fixed schema and answers with
# JSON inside JSON; hand-writing a parser for that would be inventing a
# worse serde_json.
serde_json = "1"
clap = { version = "4", features = ["derive"] }
jpeg-decoder = "0.3"
# Writing metadata without shipping exiftool and a copy of Perl. little_exif
# is the only pure-Rust crate that writes EXIF as well as reads it.
little_exif = "0.6"
# XMP goes through a plain XML reader and writer rather than through a
# dedicated XMP crate. The packet has to be *merged* — a photograph already
# carrying somebody else's properties must keep them — and a write-only
# builder cannot preserve what it never read.
quick-xml = "0.38"
fast_image_resize = "6"
# ONNX inference in pure Rust. `ort` is faster and is what everybody reaches
# for, but it is a native library to ship once per platform or to fetch at run
# time; tract cross-compiles with everything else and needs no C toolchain.
# The same trade this application makes about exiftool, and the same answer.
tract-onnx = "0.23"
# JPEG is here for the *encoder*: decoding goes through `jpeg-decoder`
# directly, but the thumbnail cache has to write its tiles as something, and a
# tile written as PNG is ten times the size for no benefit anybody can see.
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "bmp",
    "tiff",
    "gif",
] }
eframe = { version = "0.36.1", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "x11",
    "wayland",
] }
egui = "0.36"
tempfile = "3"
proptest = "1"

[workspace.lints.rust]
# An error that reaches nobody is worse than a crash: over one swallowed
# result, the prototype quietly drew not a single thumbnail.
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
todo = "warn"
dbg_macro = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Image decoding is unusably slow in a debug build otherwise.
[profile.dev.package."*"]
opt-level = 2
