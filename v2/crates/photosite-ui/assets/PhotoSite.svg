<?xml version="1.0" encoding="UTF-8"?>
<!--
  PhotoSite's icon: a pile of prints, the top one a sunset in a dark frame.

  This file is the drawing. PhotoSite.ico (the executable, the installer,
  Explorer) and PhotoSite.png (the window) are rasterized from it by
  make-icon.ps1 in this folder; edit here, then run that, never the other
  way round.

  Every shape is one flat colour with a hard edge, and there are few of
  them: on a taskbar this is sixteen pixels across, where a gradient is a
  smear and a pastel is a grey. The frame is dark so the picture is the
  brightest thing in it, and the two prints underneath are what gives the
  icon an outline on a dark taskbar.

  The top print, its picture and the line across the sky all sit on
  multiples of sixteen, so at 16 and 32 pixels their edges fall between
  pixels rather than through them. The prints underneath turn about the
  bottom right corner and stay inside the canvas: cut off by its edge they
  show a straight line where a round corner should be.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <clipPath id="picture"><rect x="64" y="32" width="160" height="160" rx="14"/></clipPath>
  </defs>
  <!-- Two prints underneath, fanned out from the bottom right corner. -->
  <g transform="rotate(-16 232 200)">
    <rect x="48" y="16" width="192" height="192" rx="28" fill="#10B8A6"/>
  </g>
  <g transform="rotate(-8 232 200)">
    <rect x="48" y="16" width="192" height="192" rx="28" fill="#F0356B"/>
  </g>
  <!-- The top print and its photograph: sun, sky, two hills. -->
  <rect x="48" y="16" width="192" height="192" rx="28" fill="#17182F"/>
  <g clip-path="url(#picture)">
    <rect x="64" y="32" width="160" height="160" fill="#3B23A6"/>
    <rect x="64" y="112" width="160" height="80" fill="#F2408F"/>
    <circle cx="174" cy="100" r="28" fill="#FFD21F"/>
    <path d="M64 157 C 92 131, 120 122, 147 142 S 200 168, 224 138 L224 192 L64 192Z" fill="#0FA37F"/>
    <path d="M64 178 C 85 154, 113 149, 137 166 S 186 187, 224 161 L224 192 L64 192Z" fill="#06604F"/>
  </g>
</svg>
