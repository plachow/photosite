[package]
name = "photosite-ai"
description = "Asking a vision model, on this machine or at a provider with a key, to describe a photograph."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
photosite-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
# With TLS, because three of the four providers live on the far side of it —
# and with the operating system's own certificate store, because a machine
# behind a re-signing proxy trusts it there and nowhere else.
ureq = { workspace = true, features = ["rustls", "platform-verifier"] }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
