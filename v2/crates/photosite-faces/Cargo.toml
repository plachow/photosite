[package]
name = "photosite-faces"
description = "Finding faces and telling them apart, on this machine and nowhere else."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
photosite-core.workspace = true
photosite-image.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tract-onnx.workspace = true
crossbeam-channel.workspace = true
# The one place this crate speaks to the network: bringing the models in, on
# request, from where their authors publish them. Certificates judged by the
# operating system's own store, for the reason `photosite-ai` gives.
ureq = { workspace = true, features = ["rustls", "platform-verifier"] }
# Every model is checked against its published hash before it is kept.
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
