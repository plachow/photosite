name: Release PhotoSite v1

# v1 is frozen; see the tag v1-final. The trigger is deliberately manual only.
# It used to fire on any v*.*.* tag, and the first release tag cut for v2 would
# have quietly built the WPF application instead.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without the leading v (e.g. 0.9.3)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "'$version' is not a supported release version."
          }
          "number=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build v1/PhotoSite.slnx -c Release

      - name: Run smoke tests
        run: dotnet run --project v1/tests/PhotoSite.SmokeTests/PhotoSite.SmokeTests.csproj -c Release --no-build

      - name: Publish self-contained application
        run: >
          dotnet publish v1/src/PhotoSite.App/PhotoSite.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.number }}
          -o artifacts/publish

      - name: Download previous Velopack release
        continue-on-error: true
        run: >
          dnx vpk --version 1.2.0 download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir artifacts/releases

      - name: Package release
        run: >
          dnx vpk --version 1.2.0 pack
          --packId PhotoSite
          --packVersion ${{ steps.version.outputs.number }}
          --packDir artifacts/publish
          --mainExe PhotoSite.exe
          --packTitle PhotoSite
          --packAuthors plachow
          --outputDir artifacts/releases

      - name: Publish GitHub release
        run: >
          dnx vpk --version 1.2.0 upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir artifacts/releases
          --publish
          --releaseName "PhotoSite ${{ steps.version.outputs.number }}"
          --tag v${{ steps.version.outputs.number }}
