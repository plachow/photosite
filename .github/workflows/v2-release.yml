name: Release PhotoSite v2

# Manual, because a tag pushed for any other purpose must not publish an
# installer. The version is not an input either — it is read from
# `v2/Cargo.toml`, so cutting a release is a version bump, a commit, and this
# button.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: v2

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Consecutive releases share the dependencies built in the release
      # profile, under one key rather than one per job. It is a modest
      # help and an honest one: the key also carries the toolchain and the
      # lock file, and GitHub drops a cache nobody has read for a week, so
      # it pays only for releases cut close together on the same Rust.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2
          shared-key: release

      # vpk is a .NET tool, and `dnx` is how .NET 10 runs one without
      # installing it. Nothing else here needs .NET.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: The version being released
        id: version
        shell: pwsh
        run: |
          $meta = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'photosite-ui').version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "'$version' cannot be released." }
          "number=$version" >> $env:GITHUB_OUTPUT
          Write-Host "PhotoSite $version"

      # The tests are not run here again. The push build — `v2.yml`: fmt,
      # clippy and the tests on Linux, macOS and Windows — has already run
      # on this very commit, and three platforms are a stronger word than
      # one more Windows run would be; they used to be repeated here all the
      # same, at twenty minutes a time, nearly all of it compiling. What this
      # step asks instead is that the build has finished, and finished
      # green. Pressing the button before it has is the one mistake this
      # guards against, and the message says so.
      - name: The push build of this commit passed
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $runs = gh run list --workflow v2.yml --commit $env:GITHUB_SHA --json status,conclusion,url | ConvertFrom-Json
          $green = @($runs | Where-Object { $_.status -eq 'completed' -and $_.conclusion -eq 'success' })
          if ($green.Count -eq 0) {
            $seen = @($runs | ForEach-Object { "  $($_.status) $($_.conclusion) $($_.url)" }) -join "`n"
            if (-not $seen) { $seen = '  no v2 build of this commit at all' }
            throw "The v2 build of $env:GITHUB_SHA has not passed yet; wait for it, or look at why:`n$seen"
          }
          Write-Host "Tested by $($green[0].url)"

      - name: Build
        run: cargo build --release -p photosite-ui -p photosite-cli

      # The binary the step above built, run as it is. Not `cargo run`:
      # asked for one package on its own, cargo resolves its features
      # differently from the two built together, and spent ten minutes
      # compiling seventy crates again to answer a question that takes a
      # second.
      - name: The binary starts up
        run: ./target/release/photosite-cli.exe --data ci-data doctor

      # So that this release can be a delta against the last one. It fails on
      # the first release, when there is nothing to be a delta against, and
      # that is not an error.
      - name: Previous releases
        continue-on-error: true
        run: >
          dnx vpk@1.2.0 --yes -- download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir artifacts/releases

      # The same script somebody runs on their own machine. The packaging is
      # defined once; CI adds only what a local build has no business doing —
      # fetching the last release and publishing this one.
      - name: Pack
        shell: pwsh
        run: ./packaging/pack.ps1 -SkipBuild

      - name: Publish
        run: >
          dnx vpk@1.2.0 --yes -- upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir artifacts/releases
          --publish
          --releaseName "PhotoSite ${{ steps.version.outputs.number }}"
          --tag v${{ steps.version.outputs.number }}
